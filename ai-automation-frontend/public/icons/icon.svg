<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#2a2018"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#6b4f10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8a54c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8a54c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Subtle warm glow behind meerkats -->
  <ellipse cx="256" cy="300" rx="200" ry="180" fill="url(#glow)"/>

  <!-- Hill / mound -->
  <path d="M0 420 Q80 350 180 370 Q256 340 330 365 Q420 350 512 410 L512 512 L0 512 Z" fill="url(#hill)" opacity="0.6"/>
  <path d="M0 440 Q120 380 200 395 Q256 370 320 390 Q400 380 512 430 L512 512 L0 512 Z" fill="#7a5c12" opacity="0.5"/>

  <!-- Far background meerkat (smallest, leftmost) -->
  <g transform="translate(115, 215)" opacity="0.5">
    <!-- Body -->
    <path d="M0 48 Q-2 30 0 15 Q2 5 8 0 Q14 5 16 15 Q18 30 16 48 Q14 55 8 58 Q2 55 0 48 Z" fill="#9a7a50"/>
    <!-- Head -->
    <ellipse cx="8" cy="-2" rx="7" ry="8" fill="#9a7a50"/>
    <!-- Ears -->
    <circle cx="2" cy="-8" r="2.5" fill="#856a42"/>
    <circle cx="14" cy="-8" r="2.5" fill="#856a42"/>
    <!-- Eyes -->
    <circle cx="5.5" cy="-2" r="1.2" fill="#1a1410"/>
    <circle cx="10.5" cy="-2" r="1.2" fill="#1a1410"/>
  </g>

  <!-- Left meerkat (medium, looking left) -->
  <g transform="translate(168, 180)">
    <!-- Tail -->
    <path d="M-2 75 Q-18 90 -24 82 Q-18 72 -4 65" fill="#c09050" opacity="0.8"/>
    <!-- Body -->
    <path d="M0 60 Q-3 38 -1 18 Q1 6 10 0 Q19 6 21 18 Q23 38 20 60 Q18 72 10 76 Q2 72 0 60 Z" fill="#c89858"/>
    <!-- Belly -->
    <path d="M4 25 Q3 38 4 55 Q6 65 10 68 Q14 65 16 55 Q17 38 16 25 Z" fill="#e0c490" opacity="0.7"/>
    <!-- Head (turned slightly left) -->
    <ellipse cx="9" cy="-4" rx="10" ry="12" fill="#c89858"/>
    <!-- Face mask -->
    <path d="M2 -7 Q5 -11 9 -11 Q13 -11 16 -7 Q17 -3 15 0 Q12 2 9 2 Q6 2 3 0 Q1 -3 2 -7 Z" fill="#8b6030"/>
    <!-- Eyes -->
    <circle cx="5.5" cy="-5" r="1.8" fill="#1a1410"/>
    <circle cx="12.5" cy="-5" r="1.8" fill="#1a1410"/>
    <circle cx="5" cy="-5.5" r="0.6" fill="white"/>
    <circle cx="12" cy="-5.5" r="0.6" fill="white"/>
    <!-- Nose -->
    <ellipse cx="9" cy="0" rx="1.5" ry="1" fill="#3d2510"/>
    <!-- Ears -->
    <ellipse cx="1" cy="-12" rx="3" ry="4" fill="#a87840" transform="rotate(-10 1 -12)"/>
    <ellipse cx="17" cy="-12" rx="3" ry="4" fill="#a87840" transform="rotate(10 17 -12)"/>
    <!-- Arms -->
    <path d="M0 30 Q-8 36 -9 44 Q-7 46 -4 43 Q-2 36 2 32 Z" fill="#a87840"/>
    <path d="M20 30 Q28 36 29 44 Q27 46 24 43 Q22 36 18 32 Z" fill="#a87840"/>
    <!-- Feet -->
    <ellipse cx="4" cy="76" rx="5" ry="3" fill="#a87840"/>
    <ellipse cx="16" cy="76" rx="5" ry="3" fill="#a87840"/>
  </g>

  <!-- Center meerkat (tallest, the leader/sentinel) -->
  <g transform="translate(235, 140)">
    <!-- Tail -->
    <path d="M28 105 Q46 120 50 112 Q44 100 30 92" fill="#d4a060" opacity="0.8"/>
    <!-- Body -->
    <path d="M0 88 Q-4 55 -1 25 Q1 8 14 0 Q27 8 29 25 Q32 55 28 88 Q25 102 14 108 Q3 102 0 88 Z" fill="#d4a060"/>
    <!-- Belly -->
    <path d="M5 32 Q3 52 5 78 Q8 95 14 100 Q20 95 23 78 Q25 52 23 32 Z" fill="#ecd4a8" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="14" cy="-6" rx="14" ry="16" fill="#d4a060"/>
    <!-- Face mask -->
    <path d="M3 -10 Q7 -16 14 -16 Q21 -16 25 -10 Q27 -4 24 0 Q20 3 14 3 Q8 3 4 0 Q1 -4 3 -10 Z" fill="#8b6030"/>
    <!-- Glasses -->
    <circle cx="8.5" cy="-8" r="5" fill="none" stroke="#3d2510" strokeWidth="1.5"/>
    <circle cx="19.5" cy="-8" r="5" fill="none" stroke="#3d2510" strokeWidth="1.5"/>
    <path d="M13.5 -8 Q14 -10 14.5 -8" stroke="#3d2510" strokeWidth="1.5" fill="none"/>
    <path d="M3.5 -8 Q1.5 -9 1 -12" stroke="#3d2510" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
    <path d="M24.5 -8 Q26.5 -9 27 -12" stroke="#3d2510" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
    <!-- Eyes behind glasses -->
    <circle cx="8.5" cy="-8" r="2.5" fill="#1a1410"/>
    <circle cx="19.5" cy="-8" r="2.5" fill="#1a1410"/>
    <circle cx="7.8" cy="-9" r="1" fill="white" opacity="0.8"/>
    <circle cx="18.8" cy="-9" r="1" fill="white" opacity="0.8"/>
    <!-- Nose -->
    <ellipse cx="14" cy="-1" rx="2" ry="1.4" fill="#3d2510"/>
    <!-- Ears (perked up) -->
    <ellipse cx="2" cy="-18" rx="4" ry="5.5" fill="#b88848" transform="rotate(-12 2 -18)"/>
    <ellipse cx="26" cy="-18" rx="4" ry="5.5" fill="#b88848" transform="rotate(12 26 -18)"/>
    <!-- Arms (folded in front, classic meerkat) -->
    <path d="M0 42 Q-10 50 -12 62 Q-10 65 -6 61 Q-3 52 2 45 Z" fill="#b88848"/>
    <path d="M28 42 Q38 50 40 62 Q38 65 34 61 Q31 52 26 45 Z" fill="#b88848"/>
    <!-- Small paws -->
    <ellipse cx="-8" cy="64" rx="4" ry="2.5" fill="#d4a060"/>
    <ellipse cx="36" cy="64" rx="4" ry="2.5" fill="#d4a060"/>
    <!-- Feet -->
    <ellipse cx="5" cy="108" rx="7" ry="4" fill="#b88848"/>
    <ellipse cx="23" cy="108" rx="7" ry="4" fill="#b88848"/>
  </g>

  <!-- Right meerkat (medium, looking right) -->
  <g transform="translate(310, 190)">
    <!-- Tail -->
    <path d="M22 70 Q36 82 40 76 Q35 66 24 60" fill="#ba8c48" opacity="0.8"/>
    <!-- Body -->
    <path d="M0 56 Q-3 35 -1 16 Q1 5 9 0 Q17 5 19 16 Q21 35 18 56 Q16 67 9 70 Q2 67 0 56 Z" fill="#ba8c48"/>
    <!-- Belly -->
    <path d="M3 22 Q2 35 3 50 Q5 60 9 63 Q13 60 15 50 Q16 35 15 22 Z" fill="#dcc088" opacity="0.7"/>
    <!-- Head (turned slightly right) -->
    <ellipse cx="9" cy="-3" rx="9.5" ry="11.5" fill="#ba8c48"/>
    <!-- Face mask -->
    <path d="M2 -6 Q5 -10 9 -10 Q13 -10 16 -6 Q17 -2 15 1 Q12 3 9 3 Q6 3 3 1 Q1 -2 2 -6 Z" fill="#7d5528"/>
    <!-- Eyes -->
    <circle cx="5.5" cy="-4.5" r="1.7" fill="#1a1410"/>
    <circle cx="12.5" cy="-4.5" r="1.7" fill="#1a1410"/>
    <circle cx="6" cy="-5" r="0.6" fill="white"/>
    <circle cx="13" cy="-5" r="0.6" fill="white"/>
    <!-- Nose -->
    <ellipse cx="9" cy="0.5" rx="1.4" ry="1" fill="#3d2510"/>
    <!-- Ears -->
    <ellipse cx="1" cy="-11" rx="2.8" ry="3.8" fill="#a07838" transform="rotate(-10 1 -11)"/>
    <ellipse cx="17" cy="-11" rx="2.8" ry="3.8" fill="#a07838" transform="rotate(10 17 -11)"/>
    <!-- Arms -->
    <path d="M0 28 Q-7 33 -8 40 Q-6 42 -3 39 Q-1 33 2 29 Z" fill="#a07838"/>
    <path d="M18 28 Q25 33 26 40 Q24 42 21 39 Q19 33 16 29 Z" fill="#a07838"/>
    <!-- Feet -->
    <ellipse cx="3" cy="70" rx="5" ry="3" fill="#a07838"/>
    <ellipse cx="15" cy="70" rx="5" ry="3" fill="#a07838"/>
  </g>

  <!-- Far right small meerkat (peeking) -->
  <g transform="translate(375, 230)" opacity="0.55">
    <path d="M0 42 Q-2 26 0 12 Q2 4 7 0 Q12 4 14 12 Q16 26 14 42 Q12 50 7 52 Q2 50 0 42 Z" fill="#a88048"/>
    <ellipse cx="7" cy="-2" rx="6.5" ry="7.5" fill="#a88048"/>
    <circle cx="4.5" cy="-2" r="1.2" fill="#1a1410"/>
    <circle cx="9.5" cy="-2" r="1.2" fill="#1a1410"/>
    <circle cx="2" cy="-7.5" r="2.2" fill="#907038"/>
    <circle cx="12" cy="-7.5" r="2.2" fill="#907038"/>
  </g>

  <!-- Foreground sand texture -->
  <path d="M0 460 Q60 445 130 450 Q200 440 256 448 Q320 440 390 450 Q450 445 512 455 L512 512 L0 512 Z" fill="#5a4410" opacity="0.3"/>
</svg>
