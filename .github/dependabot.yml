# Version updates for GitHub Actions (monthly, grouped) and security updates for
# npm/Maven. Version PRs for npm/Maven are deliberately handled by the pool workflow
# "npm-dependency-update" or by hand (workflow first) - so open-pull-requests-limit: 0 applies
# here, which only switches off the version updates. Security PRs have
# their own internal limit and keep running independently of it, as soon as they are switched on
# in the repo settings (Code security -> Dependabot alerts + Dependabot security updates) -
# that is not a setting in this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai-automation-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: maven
    directory: /ai-automation-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
