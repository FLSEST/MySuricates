# Version-Updates fuer GitHub Actions (monatlich, gruppiert) und Sicherheits-Updates fuer
# npm/Maven. Versions-PRs fuer npm/Maven macht bewusst der Pool-Workflow
# "npm-dependency-update" bzw. von Hand (Workflow-First) - hier laufen dafuer
# open-pull-requests-limit: 0, das stellt nur die Versions-Updates ab. Sicherheits-PRs haben
# ein eigenes, internes Limit und laufen unabhaengig davon weiter, sobald in den
# Repo-Einstellungen (Code security -> Dependabot alerts + Dependabot security updates)
# eingeschaltet - das ist keine Einstellung in dieser Datei.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai-automation-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: maven
    directory: /ai-automation-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
