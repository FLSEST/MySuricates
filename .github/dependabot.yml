# Security updates only. Version PRs are switched off for every ecosystem
# (open-pull-requests-limit: 0): npm/Maven go through the pool workflow
# "npm-dependency-update" or by hand (workflow first), GitHub Actions by hand. The public
# repo only receives release commits through the handover, so a version PR there could never
# be merged (2026-10-14: the first push opened one at once). Security PRs have
# their own internal limit and keep running independently of it, as soon as they are switched on
# in the repo settings (Code security -> Dependabot alerts + Dependabot security updates) -
# that is not a setting in this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ai-automation-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: maven
    directory: /ai-automation-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
