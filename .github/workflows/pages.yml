name: Pages

# Die Diagramm-Seiten auf GitHub Pages (TODO ee5a4a04). Gebaut wird bei jedem Deploy frisch aus
# der Markdown-Quelle (docs/*-diagrams.md + docs/i18n/), nicht aus den HTML-Dateien im Repo —
# Pages kann so nicht hinter der Quelle zurueckbleiben. Voraussetzung, nur in den
# Repo-Einstellungen: Settings -> Pages -> Source "GitHub Actions" (nicht "Deploy from branch":
# das veroeffentlichte ganz docs/ samt plans/ und schickte Markdown durch Jekyll) und die
# Repo-Variable PAGES_ENABLED=true. Ohne sie laeuft nur der Bau (samt --check), der Deploy
# entfaellt — sonst waere jeder passende Push auf main rot, solange Pages aus ist.
on:
  push:
    branches: [main]
    paths:
      - "docs/*-diagrams.md"
      - "docs/i18n/**"
      - "scripts/docs-diagrams.py"
      - "scripts/lib/mermaid_labels.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Ein Deploy nach dem anderen; ein laufender wird nicht abgebrochen, damit Pages nie halb
# veroeffentlicht bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Seiten bauen
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Bricht bei Drift oder offener Uebersetzung ab: Was die CI rot meldet, geht nicht online.
      - name: Diagramm-Seiten gegen die Quelle pruefen
        run: python3 scripts/docs-diagrams.py --check
      - name: Seiten erzeugen
        run: python3 scripts/docs-diagrams.py --site _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Auf Pages veroeffentlichen
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-26.04
    # Nur dieser Job darf Pages schreiben; id-token braucht deploy-pages fuer den Nachweis
    # gegenueber Pages (OIDC), nicht fuer Fremddienste.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
