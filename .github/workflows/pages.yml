name: Pages

# The diagram pages on GitHub Pages (TODO ee5a4a04). Built fresh on every deploy from
# the Markdown source (docs/*-diagrams.md + docs/i18n/), not from the HTML files in the repo —
# so Pages cannot lag behind the source. Prerequisite, only in the
# repo settings: Settings -> Pages -> Source "GitHub Actions" (not "Deploy from branch":
# that published all of docs/ including plans/ and ran Markdown through Jekyll) and the
# repo variable PAGES_ENABLED=true. Without it only the build runs (incl. --check), the deploy
# is skipped — otherwise every matching push to main would be red while Pages is off.
on:
  push:
    branches: [main]
    paths:
      - "docs/*-diagrams.md"
      - "docs/i18n/**"
      - "scripts/docs-diagrams.py"
      - "scripts/lib/mermaid_labels.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deploy at a time; a running one is not cancelled so that Pages is never left half
# published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Seiten bauen
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Fails on drift or an open translation: what CI reports red does not go online.
      - name: Diagramm-Seiten gegen die Quelle pruefen
        run: python3 scripts/docs-diagrams.py --check
      - name: Seiten erzeugen
        run: python3 scripts/docs-diagrams.py --site _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Auf Pages veroeffentlichen
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-26.04
    # Only this job may write Pages; id-token is needed by deploy-pages for the proof
    # towards Pages (OIDC), not for third-party services.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
