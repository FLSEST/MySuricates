name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes v*-Tag, für das nachträglich ein Release entstehen soll"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release anlegen
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0 — release-notes.sh needs the full history (merge commits between
      # the tags, the previous tag itself).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Tag bestimmen
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} existiert nicht." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Vorgänger-Tag bestimmen
        id: prev
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Sorted by semver: the line right before its own tag is the predecessor — more robust
          # than --merged, because it does not depend on the first-parent topology.
          PREV="$(git tag --list 'v[0-9]*' --sort=v:refname | grep -B1 -x "$TAG" | head -1)"
          [ "$PREV" = "$TAG" ] && PREV=""
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
      # A supplied notes file (from the handover workflow that brings a reviewed commit together with
      # its tag into the public repo) takes precedence — release-notes.sh picks up where the
      # own history of this repo ends (see docs/entwicklung.md → „GitHub-Release bei
      # jedem Tag").
      - name: Notizen bereitstellen
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PREV="${{ steps.prev.outputs.prev }}"
          SUPPLIED="release-notes/${TAG}.md"
          if [ -f "$SUPPLIED" ]; then
            echo "Verwende mitgelieferte Notizdatei ${SUPPLIED}"
            cp "$SUPPLIED" notes.md
          else
            echo "Erzeuge Notizen aus der Historie dieses Repos (Vorgänger: ${PREV:-keiner})"
            bash scripts/release-notes.sh "$PREV" "$TAG" > notes.md
          fi
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --verify-tag \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file notes.md
