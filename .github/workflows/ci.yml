name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  hygiene:
    name: Public Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run public-hygiene gate
        run: bash scripts/ci/public-hygiene.sh --tracked
      - name: Hygiene-Gate Selbsttest (Worktrees, fehlende Regeldatei)
        run: bash scripts/tests/test-public-hygiene.sh
      - name: Setup-Modul-Preset Selbsttest
        run: bash scripts/tests/test-module-preset.sh
      # Das Zahlen-Gate als eigener Schritt: es lief bisher nur als Fall 20 innerhalb von
      # test-public-hygiene.sh mit — ein Umbau dort haette es unbemerkt aus der CI genommen.
      - name: Doku-Zahlen gegen den Code pruefen
        run: bash scripts/public-readiness/doc-facts-check.sh
      - name: Doku-Zahlen-Gate Selbsttest
        run: bash scripts/tests/test-doc-facts-check.sh
      - name: Audit-Fakten Selbsttest
        run: bash scripts/tests/test-audit-facts.sh
      - name: Coverage-Snapshot Selbsttest
        run: bash scripts/tests/test-coverage-snapshot.sh

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-automation-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # Regressionswaechter fuer ExternalConfigIsolationTest (TODO b7e0d357): CI legt sonst nie
      # eine config/application.yml an, also lief der reale Leak-Pfad hier nie durch. Werte
      # bewusst abweichend vom Classpath-Default, damit ein Leck sichtbar waere.
      - name: Externe config/application.yml mit abweichenden Werten anlegen
        run: |
          mkdir -p config
          cat > config/application.yml <<'EOF'
          automation:
            modules:
              preset: core
              ui-editable: true
          EOF
      # Surefire fuehrt Unit- und Integrationstests gemeinsam aus. Die Integrationstests
      # aktivieren das Spring-Profil "integration" per @ActiveProfiles; ein eigenes
      # Maven-Profil dafuer gibt es nicht. Jede Test-JVM bekommt ihre eigene SQLite-Datei
      # (IntegrationTestDbSessionListener), der Pool bleibt bei einer Verbindung.
      - name: Run backend tests
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend Lint + Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-automation-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ai-automation-frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: ai-automation-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
