name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  hygiene:
    name: Public Hygiene
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0, weil doc-facts-check.sh die Commit-Zahl der README-Kopftabelle gegen
      # `git rev-list --count HEAD` haelt. Im flachen Standard-Checkout zaehlt das nur die
      # geholte Tiefe (1) — das Gate ueberspringt die Zahl dann hoerbar, prueft sie also nie.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run public-hygiene gate
        run: bash scripts/ci/public-hygiene.sh --tracked
      - name: Hygiene-Gate Selbsttest (Worktrees, fehlende Regeldatei)
        run: bash scripts/tests/test-public-hygiene.sh
      # Dieselbe Pruefung wie der pre-push-Hook, hier auf die Commits dieses Push-Ereignisses:
      # faengt, was an einem Klon ohne installierte Hooks vorbeikam (Autor-Adresse, Nachricht,
      # neu hinzugekommene Inhalte). Beim ersten Push eines Branches ist `before` die Null-Referenz,
      # nach einem Force-Push liegt er nicht im Checkout — beides wird hoerbar uebersprungen.
      - name: Pre-Push-Gate auf die Commits dieses Pushes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Kein Bereich (neuer Branch oder Force-Push) — Commit-Pruefung uebersprungen"
          else
            bash scripts/ci/pre-push-checks.sh --range "${BEFORE}..${GITHUB_SHA}" --skip-tree --skip-build
          fi
      - name: Pre-Push-Gate Selbsttest (Hooks, Nachrichten, Autor-Adresse, Scope)
        run: bash scripts/tests/test-pre-push-checks.sh
      - name: Setup-Modul-Preset Selbsttest
        run: bash scripts/tests/test-module-preset.sh
      # Der Probelauf selbst braucht Docker und zehn Minuten — hier nur Aufruf, Vorab-Pruefungen
      # und der Report-Renderer; der echte Lauf ist der Workflow "Installer-Probe" vor einem Release.
      - name: Installer-Probe Selbsttest (ohne Docker)
        run: |
          bash scripts/tests/test-installer-probe.sh
          python3 -m unittest discover -s scripts/tests -p 'test_installer_probe_report.py'
      # Der Lasttest selbst baut ein JAR und faehrt eine Wegwerf-Instanz (Workflow "Lasttest vor dem
      # Release", release.sh fragt danach) — hier nur Auswertung, Verdict, Baseline und Treiber gegen
      # einen HTTP-Server aus der Standardbibliothek.
      - name: Lasttest Selbsttest (ohne Instanz)
        run: python3 -m unittest discover -s scripts/tests -p 'test_load_test_*.py'
      - name: Container-Instanz Selbsttest (deploy/, ohne Docker)
        run: |
          bash scripts/tests/test-host-mounts.sh
          bash scripts/tests/test-instance.sh
          bash scripts/tests/test-deploy-files.sh
          bash scripts/tests/test-staging-override.sh
      # Die Python-Skripte fuer Betreiber fragen die eigene Instanz nie ueber einen Proxy aus der Umgebung
      # (cf662c01): echte Aufrufe gegen fake_instance.py, braucht nur python3.
      - name: Eigene Instanz ohne Proxy (Python-Skripte)
        run: python3 -m unittest discover -s scripts/tests -p 'test_local_api_proxy.py'
      # TODO-Batch (cc0eb3ba): Skripte gegen Wegwerf-Repos, braucht nur python3 und git.
      - name: TODO-Batch-Skripte
        run: python3 -m unittest discover -s scripts/tests -p 'test_todo_batch.py'
      # Liefen bisher nur lokal (cad7d821): Dev-Starter (JAR-Laufzeit, Run-Waechter, Proxy, Container-
      # Modus mit Stubs), das Integritaets-Gate von cleanup-runs.sh und die Seed-Vorlage gegen einen
      # curl-Stub. Brauchen python3, curl, git, jq, node und script — kein Backend, kein Docker, keine KI-CLI.
      - name: Dev-Starter, Run-Aufraeumer und Seed-Vorlage Selbsttest
        run: |
          bash scripts/tests/test-start-autotrigger-dev.sh
          bash scripts/tests/test-cleanup-runs.sh
          bash scripts/tests/test-seed-workflows-example.sh
      - name: Installer-Bausteine Selbsttest (Anbieter, Sprachen, Oberflaeche, Kopf-Grafik)
        run: |
          bash scripts/tests/test-providers.sh
          bash scripts/tests/test-netaddr.sh
          bash scripts/tests/test-i18n.sh
          bash scripts/tests/test-tui.sh
          bash scripts/tests/test-deps.sh
          bash scripts/tests/test-setup.sh
          python3 scripts/tools/installer-art.py --check
      # Das Zahlen-Gate als eigener Schritt: es lief bisher nur als Fall 20 innerhalb von
      # test-public-hygiene.sh mit — ein Umbau dort haette es unbemerkt aus der CI genommen.
      # Doku-Zahlen, Doku-Verweise/DE-EN-Gleichstand und Diagramm-Drift laufen ueber dasselbe
      # Skript wie der pre-push-Hook (--tree), damit Hook und CI nicht auseinanderlaufen.
      - name: Bestands-Gates (Doku-Zahlen, Doku-Verweise, Diagramm-Seiten) — wie im pre-push-Hook
        run: bash scripts/ci/pre-push-checks.sh --tree
      - name: Doku-Zahlen-Gate Selbsttest
        run: bash scripts/tests/test-doc-facts-check.sh
      - name: Doku-Readiness-Gate Selbsttest
        run: bash scripts/tests/test-docs-check.sh
      - name: Evidenz-Scans Selbsttest (Oberflaeche, Architektur, Inventar)
        run: bash scripts/tests/test-readiness-scans.sh
      - name: Doku-Verweis-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_parity_check.py'
      # Misst nur, meldet nicht: das Urteil ueber die Kandidaten faellt der Workflow
      # "Doku-Zehrprobe". Hier laeuft allein der Selbsttest, damit die Heuristik nicht
      # unbemerkt driftet — ein Gate waere es nicht, weil "verwaist" ein Urteil ist.
      - name: Doku-Zehrprobe Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_orphan_scan.py'
      - name: Konzeptseiten-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_concept_pages.py'
      # Die HTML-Diagrammseiten werden aus docs/*-diagrams.md erzeugt. Ohne dieses
      # Gate faellt eine von Hand geaenderte HTML-Datei erst auf, wenn jemand die
      # Markdown-Quelle anfasst und die Aenderung wieder ueberschreibt.
      - name: Diagramm-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_diagrams.py'
      - name: Audit-Fakten Selbsttest
        run: bash scripts/tests/test-audit-facts.sh
      # Einstufung des Architektur-Reviews (b8c06b94): liest nur Fixture-Faktenblaetter, kein jdeps,
      # kein Maven. Die Mess-Suiten test-arch-metrics.sh/test-frontend-metrics.sh laufen lokal.
      - name: Architektur-Einstufung Selbsttest
        run: bash scripts/tests/test-arch-findings.sh
      - name: Coverage-Snapshot Selbsttest
        run: bash scripts/tests/test-coverage-snapshot.sh
      - name: Schwachstellen-Scan Selbsttest (ohne Netz)
        run: bash scripts/tests/test-dependency-risk-scan.sh
      # Faehrt release.sh wirklich, aber in einem Wegwerf-Repo: der getaggte Commit muss die
      # Version ohne -SNAPSHOT tragen (TODO dd82775b), sonst meldet jede Installation SNAPSHOT.
      - name: Release-Skript Selbsttest
        run: bash scripts/tests/test-release.sh
      # release-notes.sh erzeugt die GitHub-Release-Notizen deterministisch, ohne KI-Aufruf —
      # der Selbsttest laeuft in einem Wegwerf-Repo mit echten Merge-Commits (release.yml).
      - name: Release-Notizen Selbsttest
        run: bash scripts/tests/test-release-notes.sh
      # release-handover.sh zwischen zwei Wegwerf-Repos (Arbeits-Repo + lokales bare/Klon): Ausschluss,
      # Treue zum Tag, Gates mit Zuruecksetzen, annotiertes Tag — und dass nie gepusht wird.
      - name: Release-Uebergabe Selbsttest
        run: bash scripts/tests/test-release-handover.sh

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend Tests
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ai-automation-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # Regressionswaechter fuer ExternalConfigIsolationTest (TODO b7e0d357): CI legt sonst nie
      # eine config/application.yml an, also lief der reale Leak-Pfad hier nie durch. Werte
      # bewusst abweichend vom Classpath-Default, damit ein Leck sichtbar waere.
      - name: Externe config/application.yml mit abweichenden Werten anlegen
        run: |
          mkdir -p config
          cat > config/application.yml <<'EOF'
          automation:
            modules:
              preset: core
              ui-editable: true
          EOF
      # Surefire fuehrt Unit- und Integrationstests gemeinsam aus. Die Integrationstests
      # aktivieren das Spring-Profil "integration" per @ActiveProfiles; ein eigenes
      # Maven-Profil dafuer gibt es nicht. Jede Test-JVM bekommt ihre eigene SQLite-Datei
      # (IntegrationTestDbSessionListener), der Pool bleibt bei einer Verbindung.
      # Die Ausgabe der Tests geht je Klasse nach target/surefire-reports/<Klasse>-output.txt:
      # Fehlerpfad-Tests lassen den Code absichtlich ERROR samt Stacktrace loggen (am
      # 2026-09-21: 93 ERROR-Zeilen, 5716 Stacktrace-Zeilen in einem gruenen Lauf), und darin
      # ging jede echte Meldung unter. Im Log bleiben Running/Tests run und die Surefire-
      # Fehlermeldung eines roten Tests. Nur hier, nicht in der pom.xml: Der Workflow
      # mysuricates-health-check greppt lokal target/surefire-reports/*.txt nach ERROR.
      - name: Run backend tests
        run: ./mvnw -B --no-transfer-progress -Dmaven.test.redirectTestOutputToFile=true test
      - name: Surefire-Berichte samt Testausgabe sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-surefire-reports
          path: ai-automation-backend/target/surefire-reports/

  frontend:
    name: Frontend Lint + Test + Build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ai-automation-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ai-automation-frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: ai-automation-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
