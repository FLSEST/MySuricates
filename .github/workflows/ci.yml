name: CI

# Push only on main and on release tags: origin has only main, working branches from
# worktrees are not pushed. A PR branch in the same repo used to run twice (push and
# pull_request); now pull_request alone covers it, without a branch filter, so that foreign
# PRs also run in full.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Once a week everything, regardless of the path filter: interactions and drift
  # (npm state, OSV data) show up even without a matching change.
  schedule:
    - cron: "0 4 * * 1"

# A new run of the same ref cancels the old one — except on main: there every commit
# should get its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Which suites does this change need? The classification lives in scripts/ci/changed-scopes.sh
  # (including the list of what backend tests read outside ai-automation-backend/) and has its
  # own self-test. No third-party action: just git diff. Tags, schedule, workflow_dispatch and
  # any missing base yield true for both suites.
  changes:
    name: Geaenderte Bereiche
    runs-on: ubuntu-26.04
    outputs:
      backend: ${{ steps.scopes.outputs.backend }}
      frontend: ${{ steps.scopes.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # PR: base and head of the PR (not the merge commit), push: before..sha. GITHUB_EVENT_NAME
      # and GITHUB_REF_TYPE are set by GitHub itself; the script reads them.
      - name: Geaenderte Pfade einordnen
        id: scopes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/changed-scopes.sh | tee -a "$GITHUB_OUTPUT"

  hygiene:
    name: Public Hygiene
    runs-on: ubuntu-26.04
    steps:
      # fetch-depth: 0, because doc-facts-check.sh checks the commit count of the README header table against
      # `git rev-list --count HEAD`. In the shallow default checkout that only counts the
      # fetched depth (1) — the gate then audibly skips the number, i.e. never checks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run public-hygiene gate
        run: bash scripts/ci/public-hygiene.sh --tracked
      - name: Hygiene-Gate Selbsttest (Worktrees, fehlende Regeldatei)
        run: bash scripts/tests/test-public-hygiene.sh
      # The same check as the pre-push hook, here on the commits of this push event:
      # catches what slipped past a clone without installed hooks (author address, message,
      # newly added content). Changed exception files (.gitleaksignore, hygiene rules,
      # gate, hooks, this file) do not block here — there is no human to release them —
      # but appear as a warning and in the job summary (--rules-report-only).
      # On the first push of a ref (a tag too) `before` is the null ref, after a
      # force push it is not in the checkout — both are audibly skipped.
      - name: Pre-Push-Gate auf die Commits dieses Pushes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Kein Bereich (neuer Branch oder Force-Push) — Commit-Pruefung uebersprungen"
          else
            bash scripts/ci/pre-push-checks.sh --range "${BEFORE}..${GITHUB_SHA}" --skip-tree --skip-build --rules-report-only
          fi
      # The same for a pull request, so that foreign PRs also get the commit check.
      # The PR head is checked, not the merge commit GitHub builds for the checkout —
      # its committer is GitHub itself. The lower bound is the merge base of base and head:
      # if the PR is behind main, `git diff base..head` would otherwise see the newer main lines as
      # removed and the old ones as newly added. If one of the commits is missing from the checkout
      # (fetch-depth 0 fetches all branches, the head hangs off the merge commit), it is audibly
      # skipped.
      - name: Pre-Push-Gate auf die Commits dieses Pull Requests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null || ! git cat-file -e "${PR_HEAD}^{commit}" 2>/dev/null \
             || ! MERGE_BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"; then
            echo "Kein Bereich (Basis oder Kopf des PRs nicht im Checkout) — Commit-Pruefung uebersprungen"
          else
            bash scripts/ci/pre-push-checks.sh --range "${MERGE_BASE}..${PR_HEAD}" --skip-tree --skip-build --rules-report-only
          fi
      - name: Pre-Push-Gate Selbsttest (Hooks, Nachrichten, Autor-Adresse, Scope)
        run: bash scripts/tests/test-pre-push-checks.sh
      - name: Pfadfilter der CI Selbsttest (changed-scopes)
        run: bash scripts/tests/test-changed-scopes.sh
      - name: Setup-Modul-Preset Selbsttest
        run: bash scripts/tests/test-module-preset.sh
      # The trial run itself needs Docker and ten minutes — here only the invocation, pre-checks
      # and the report renderer; the real run is the workflow "Installer-Probe" before a release.
      - name: Installer-Probe Selbsttest (ohne Docker)
        run: |
          bash scripts/tests/test-installer-probe.sh
          python3 -m unittest discover -s scripts/tests -p 'test_installer_probe_report.py'
      # The load test itself builds a JAR and drives a throwaway instance (workflow "Lasttest vor dem
      # Release", release.sh asks for it) — here only evaluation, verdict, baseline and driver against
      # an HTTP server from the standard library.
      - name: Lasttest Selbsttest (ohne Instanz)
        run: python3 -m unittest discover -s scripts/tests -p 'test_load_test_*.py'
      - name: Container-Instanz Selbsttest (deploy/, ohne Docker)
        run: |
          bash scripts/tests/test-host-mounts.sh
          bash scripts/tests/test-instance.sh
          bash scripts/tests/test-deploy-files.sh
          bash scripts/tests/test-staging-override.sh
      # The Python scripts for operators never query their own instance through a proxy from the environment
      # (cf662c01): real calls against fake_instance.py, needs only python3.
      - name: Eigene Instanz ohne Proxy (Python-Skripte)
        run: python3 -m unittest discover -s scripts/tests -p 'test_local_api_proxy.py'
      # TODO batch (cc0eb3ba): scripts against throwaway repos, needs only python3 and git.
      - name: TODO-Batch-Skripte
        run: python3 -m unittest discover -s scripts/tests -p 'test_todo_batch.py'
      # README sync (c13a942b): section diff, insertion and byte gate against throwaway repos,
      # plus the parity of the real READMEs — needs only python3 and git.
      - name: README-Sync-Skript
        run: python3 -m unittest discover -s scripts/tests -p 'test_readme_sync.py'
      # Used to run only locally (cad7d821): dev starter (JAR runtime, run guard, proxy, container
      # mode with stubs) and the seed template against a curl stub. They need python3, curl, git, jq,
      # node and script — no backend, no Docker, no AI CLI.
      - name: Dev-Starter und Seed-Vorlage Selbsttest
        run: |
          bash scripts/tests/test-start-mysuricates-dev.sh
          bash scripts/tests/test-seed-workflows-example.sh
      # Ran in no CI step and not in Maven (159e3e66): gate blocks of the combined
      # pool workflows (empty/unknown report = YELLOW) and the shipped run-workspace.py
      # including retention. They need only python3, bash and git.
      - name: Pool-Gates und Run-Workspace (Python-Tests des Backends)
        run: python3 -m unittest discover -s ai-automation-backend/src/test/python -p 'test_*.py'
      # tryout.sh with a Docker stub in a throwaway repo — no real Docker (159e3e66).
      - name: Tryout-Skript Selbsttest (ohne Docker)
        run: bash scripts/tests/test-tryout.sh
      - name: Installer-Bausteine Selbsttest (Anbieter, Sprachen, Oberflaeche, Kopf-Grafik)
        run: |
          bash scripts/tests/test-providers.sh
          bash scripts/tests/test-netaddr.sh
          bash scripts/tests/test-i18n.sh
          bash scripts/tests/test-tui.sh
          bash scripts/tests/test-deps.sh
          bash scripts/tests/test-setup.sh
          python3 scripts/tools/installer-art.py --check
      # The numbers gate as its own step: it used to run only as case 20 inside
      # test-public-hygiene.sh — a rework there would have removed it from CI unnoticed.
      # Doc numbers, doc references/DE-EN parity, diagram drift and the API endpoint comparison
      # run through the same script as the pre-push hook (--tree), so that hook and CI do not
      # drift apart.
      - name: Bestands-Gates (Doku-Zahlen, Doku-Verweise, Diagramm-Seiten, API-Endpunkte) — wie im pre-push-Hook
        run: bash scripts/ci/pre-push-checks.sh --tree
      - name: Doku-Zahlen-Gate Selbsttest
        run: bash scripts/tests/test-doc-facts-check.sh
      - name: API-Endpunkt-Diff-Gate Selbsttest
        run: bash scripts/tests/test-api-endpoint-diff.sh
      - name: Doku-Readiness-Gate Selbsttest
        run: bash scripts/tests/test-docs-check.sh
      - name: Evidenz-Scans Selbsttest (Oberflaeche, Architektur, Inventar)
        run: bash scripts/tests/test-readiness-scans.sh
      - name: Doku-Verweis-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_parity_check.py'
      # Only measures, does not report: the verdict on the candidates is made by the workflow
      # "Doku-Zehrprobe". Only the self-test runs here, so that the heuristic does not
      # drift unnoticed — it would not be a gate, because "orphaned" is a judgement.
      - name: Doku-Zehrprobe Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_orphan_scan.py'
      - name: Konzeptseiten-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_concept_pages.py'
      # The HTML diagram pages are generated from docs/*-diagrams.md. Without this
      # gate, a hand-edited HTML file is only noticed when someone touches the
      # Markdown source and overwrites the change again.
      - name: Diagramm-Gate Selbsttest
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_diagrams.py'
      - name: Audit-Fakten Selbsttest
        run: bash scripts/tests/test-audit-facts.sh
      # Classification of the architecture review (b8c06b94): reads only fixture fact sheets, no jdeps,
      # no Maven. test-arch-metrics.sh needs a build (jdeps) and runs locally.
      - name: Architektur-Einstufung Selbsttest
        run: bash scripts/tests/test-arch-findings.sh
      # Frontend measurement against a fixture: read-only, no npm, no node_modules (159e3e66).
      - name: Frontend-Metriken Selbsttest
        run: bash scripts/tests/test-frontend-metrics.sh
      - name: Coverage-Snapshot Selbsttest
        run: bash scripts/tests/test-coverage-snapshot.sh
      - name: Schwachstellen-Scan Selbsttest (ohne Netz)
        run: bash scripts/tests/test-dependency-risk-scan.sh
      # Really runs release.sh, but in a throwaway repo: the tagged commit must carry the
      # version without -SNAPSHOT (TODO dd82775b), otherwise every installation reports SNAPSHOT.
      - name: Release-Skript Selbsttest
        run: bash scripts/tests/test-release.sh
      # release-notes.sh generates the GitHub release notes deterministically, without an AI call —
      # the self-test runs in a throwaway repo with real merge commits (release.yml).
      - name: Release-Notizen Selbsttest
        run: bash scripts/tests/test-release-notes.sh
      # release-handover.sh between two throwaway repos (working repo + local bare/clone): exclusion,
      # fidelity to the tag, gates with reset, annotated tag — and that it never pushes.
      - name: Release-Uebergabe Selbsttest
        run: bash scripts/tests/test-release-handover.sh

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Skipped only on an explicit "false" from changes: if the classification itself fails,
  # the suite runs anyway (!cancelled() instead of the implicit success()), instead of being
  # skipped and thereby passing.
  backend:
    name: Backend Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ai-automation-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      # Regression guard for ExternalConfigIsolationTest (TODO b7e0d357): CI otherwise never creates
      # a config/application.yml, so the real leak path never ran here. Values are
      # deliberately different from the classpath default, so that a leak would be visible.
      - name: Externe config/application.yml mit abweichenden Werten anlegen
        run: |
          mkdir -p config
          cat > config/application.yml <<'EOF'
          automation:
            modules:
              preset: core
              ui-editable: true
          EOF
      # Surefire runs unit and integration tests together. The integration tests
      # activate the Spring profile "integration" via @ActiveProfiles; there is no
      # separate Maven profile for it. Each test JVM gets its own SQLite file
      # (IntegrationTestDbSessionListener), the pool stays at one connection.
      # The output of the tests goes per class to target/surefire-reports/<Klasse>-output.txt:
      # error-path tests deliberately make the code log ERROR including a stack trace (on
      # 2026-09-21: 93 ERROR lines, 5716 stack trace lines in a green run), and every real
      # message was lost in that. The log keeps Running/Tests run and the Surefire
      # failure message of a red test. Only here, not in pom.xml: the workflow
      # mysuricates-health-check locally greps target/surefire-reports/*.txt for ERROR.
      - name: Run backend tests
        run: ./mvnw -B --no-transfer-progress -Dmaven.test.redirectTestOutputToFile=true test
      - name: Surefire-Berichte samt Testausgabe sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-surefire-reports
          path: ai-automation-backend/target/surefire-reports/

  frontend:
    name: Frontend Lint + Test + Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ai-automation-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ai-automation-frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: ai-automation-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
