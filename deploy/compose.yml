# Genau eine MySuricates-Instanz. Nicht direkt benutzen: scripts/instance.sh setzt Namen (Container,
# Volumes, Image aus MYSURICATES_PREFIX und dem Instanznamen), Port und Benutzer-ID und erzeugt daneben das Override mit den Mounts dieses Rechners
# (scripts/lib/host-mounts.sh). Mehrere Instanzen (z. B. Dev · Test · Prod) = mehrere Namen.
name: ${MYSURICATES_CONTAINER:?}
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        # Neuer Wert (etwa der Monat) = NodeSource- und Docker-Repo frisch statt aus dem Layer-Cache (8b7a39b9)
        APT_REFRESH: ${MYSURICATES_APT_REFRESH:-}
    image: ${MYSURICATES_IMAGE:?}
    container_name: ${MYSURICATES_CONTAINER:?}
    ports:
      - "${MYSURICATES_BIND:-127.0.0.1}:${MYSURICATES_PORT:?}:9090"
    # Alle AUTOMATION_*-Zeilen der Instanz-Datei (Einzelmodule, Haertung, Standard-Anbieter …)
    # gehen unveraendert an die Instanz; die Liste darunter setzt nur, was aus MYSURICATES_* folgt.
    env_file:
      - ${MYSURICATES_ENV_FILE:?}
    environment:
      - HOST_UID=${HOST_UID:?}
      - HOST_GID=${HOST_GID:?}
      - HOST_USER=${HOST_USER:?}
      - HOST_HOME=${HOST_HOME:?}
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      - AUTOMATION_MODULES_PRESET=${MYSURICATES_PRESET:-core}
      - AUTOMATION_ENVIRONMENT=${MYSURICATES_ENVIRONMENT:-}
      - AUTOMATION_CORS_ORIGINS=http://localhost:${MYSURICATES_PORT:?},http://127.0.0.1:${MYSURICATES_PORT:?}
      # Innen lauscht das Backend auf 9090; den veröffentlichten Port kennt es nur hierüber (Onboarding-Texte).
      - AUTOMATION_INSTANCE_URL=http://localhost:${MYSURICATES_PORT:?}
      - AUTOMATION_INSTANCE_CONTAINER=${MYSURICATES_CONTAINER:?}
      - AUTOMATION_HARDENING_SEALING=${MYSURICATES_HARDENING_SEALING:-false}
      - AUTOMATION_HARDENING_REQUIRESEALEDFORUNATTENDED=${MYSURICATES_HARDENING_REQUIRE_SEALED:-false}
    volumes:
      - data:/app/data
      # Integrations-Schluessel getrennt von der DB (IntegrationEncryptionService, 3fb2242c)
      - secrets:/app/secrets
    restart: unless-stopped
volumes:
  data:
    name: ${MYSURICATES_CONTAINER:?}-data
  secrets:
    name: ${MYSURICATES_CONTAINER:?}-secrets
