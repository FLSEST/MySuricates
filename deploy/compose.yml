# Exactly one MySuricates instance. Do not use directly: scripts/instance.sh sets names (container,
# volumes, image from MYSURICATES_PREFIX and the instance name), port and user ID and also generates the override with this machine's mounts
# (scripts/lib/host-mounts.sh). Several instances (e.g. Dev · Test · Prod) = several names.
name: ${MYSURICATES_CONTAINER:?}
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
      args:
        # New value (e.g. the month) = NodeSource and Docker repo fresh instead of from the layer cache (8b7a39b9)
        APT_REFRESH: ${MYSURICATES_APT_REFRESH:-}
    image: ${MYSURICATES_IMAGE:?}
    container_name: ${MYSURICATES_CONTAINER:?}
    ports:
      - "${MYSURICATES_BIND:-127.0.0.1}:${MYSURICATES_PORT:?}:9090"
    # All AUTOMATION_* lines of the instance file (individual modules, hardening, default provider …)
    # go unchanged to the instance; the list below only sets what follows from MYSURICATES_*.
    env_file:
      - ${MYSURICATES_ENV_FILE:?}
    environment:
      - HOST_UID=${HOST_UID:?}
      - HOST_GID=${HOST_GID:?}
      - HOST_USER=${HOST_USER:?}
      - HOST_HOME=${HOST_HOME:?}
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      - AUTOMATION_MODULES_PRESET=${MYSURICATES_PRESET:-core}
      - AUTOMATION_ENVIRONMENT=${MYSURICATES_ENVIRONMENT:-}
      - AUTOMATION_CORS_ORIGINS=http://localhost:${MYSURICATES_PORT:?},http://127.0.0.1:${MYSURICATES_PORT:?}
      # Inside, the backend listens on 9090; it only knows the published port through this (onboarding texts).
      - AUTOMATION_INSTANCE_URL=http://localhost:${MYSURICATES_PORT:?}
      - AUTOMATION_INSTANCE_CONTAINER=${MYSURICATES_CONTAINER:?}
      - AUTOMATION_HARDENING_SEALING=${MYSURICATES_HARDENING_SEALING:-false}
      - AUTOMATION_HARDENING_REQUIRESEALEDFORUNATTENDED=${MYSURICATES_HARDENING_REQUIRE_SEALED:-false}
    volumes:
      - data:/app/data
      # Integration keys kept apart from the DB (IntegrationEncryptionService, 3fb2242c)
      - secrets:/app/secrets
    restart: unless-stopped
volumes:
  data:
    name: ${MYSURICATES_CONTAINER:?}-data
  secrets:
    name: ${MYSURICATES_CONTAINER:?}-secrets
