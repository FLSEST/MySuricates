<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow-Strategie: Die richtigen Dinge richtig automatisieren</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
:root{--bg:#0a1628;--surface:#111d33;--cyan:#00d4ff;--orange:#ff6b35;--green:#00e676;--text:#e8edf5;--muted:#7a8ba8;}
.reveal{font-family:'Inter',system-ui,sans-serif;color:var(--text);}
.reveal .slides{text-align:left;}
.reveal .slides section{background:var(--bg);padding:40px 60px;}
.reveal h1,.reveal h2,.reveal h3{font-weight:700;color:var(--cyan);text-transform:none;letter-spacing:-0.02em;}
.reveal h1{font-size:2.8em;font-weight:900;}
.reveal h2{font-size:2em;border-bottom:3px solid var(--orange);padding-bottom:12px;display:inline-block;}
.reveal h3{font-size:1.4em;color:var(--orange);}
.reveal p,.reveal li{font-size:0.95em;line-height:1.7;color:var(--text);}
.reveal ul{list-style:none;padding-left:0;}
.reveal ul li::before{content:'▸ ';color:var(--cyan);font-weight:bold;}
.reveal .highlight{color:var(--cyan);font-weight:600;}
.reveal .warn{color:var(--orange);font-weight:600;}
.reveal .success{color:var(--green);font-weight:600;}
.reveal table{width:100%;border-collapse:collapse;margin:20px 0;font-size:0.85em;}
.reveal th{background:var(--surface);color:var(--cyan);padding:12px 16px;text-align:left;border-bottom:2px solid var(--cyan);}
.reveal td{padding:10px 16px;border-bottom:1px solid rgba(122,139,168,0.2);}
.reveal tr:hover td{background:rgba(0,212,255,0.05);}
.reveal .card{background:var(--surface);border-radius:12px;padding:24px;margin:12px 0;border-left:4px solid var(--cyan);}
.reveal .card.warn-card{border-left-color:var(--orange);}
.reveal .card.success-card{border-left-color:var(--green);}
.reveal pre.mermaid{background:transparent;box-shadow:none;font-size:0.7em;}
.reveal .mermaid svg{max-height:420px;}
.reveal .subtitle{font-size:1.3em;color:var(--muted);font-weight:300;margin-top:8px;}
.reveal .stat{font-size:3em;font-weight:900;color:var(--cyan);}
.reveal .stat-label{font-size:0.9em;color:var(--muted);}
.reveal .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.reveal .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.reveal .fragment.fade-up{transition:all 0.4s ease;}
.slide-background{background:var(--bg)!important;}
</style>
</head>
<body>
<div class="reveal"><div class="slides">
<!-- SLIDES WERDEN VOM AGENTIC BLOCK HIER EINGEFÜGT -->
</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({startOnLoad:false,theme:'dark',themeVariables:{primaryColor:'#00d4ff',primaryTextColor:'#e8edf5',primaryBorderColor:'#00d4ff',lineColor:'#7a8ba8',secondaryColor:'#ff6b35',tertiaryColor:'#111d33',background:'#0a1628',mainBkg:'#111d33',nodeBorder:'#00d4ff',clusterBkg:'#111d33',titleColor:'#00d4ff',edgeLabelBackground:'#111d33'}});
Reveal.initialize({hash:true,transition:'fade',transitionSpeed:'default',backgroundTransition:'fade',controls:true,progress:true,center:true,width:1280,height:720}).then(()=>{mermaid.run();});
Reveal.on('slidechanged',()=>{setTimeout(()=>mermaid.run(),100);});
</script>
</body>
</html>
