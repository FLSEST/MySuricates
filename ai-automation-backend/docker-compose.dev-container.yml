# Dev-Backend im Container statt auf dem Host (TODO a1236a64).
#
# Wird ueber `scripts/start-autotrigger-dev.sh --container` benutzt, nicht direkt. Der Starter
# erzeugt daneben eine Override-Datei mit dem, was vom Host hineinkommt (scripts/lib/host-mounts.sh:
# KI-Anbieter nach AUTOTRIGGER_DEV_AI_FROM_HOST, Docker-Socket) — deshalb steht hier nichts davon
# fest verdrahtet.
#
# Warum nicht docker-compose.yml? Die baut aus docker/Dockerfile.backend, einem reinen
# JRE-Alpine-Image **ohne Node**. Claude ist ein natives glibc-Programm (Alpine hat musl), Codex und
# Pi sind Node-Programme; in diesem Image kann keines davon laufen. docker/Dockerfile.stable ist
# Ubuntu-basiert und bringt Node mit — deshalb baut diese Datei daraus, wie es Test und Stable auch tun.
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.stable
      # Das Image legt einen Benutzer mit den IDs des Hosts an, damit die gemounteten
      # Anmeldungen unter $HOME lesbar bleiben. Ohne diese Args scheitert der Build im
      # `useradd` — der Starter setzt sie deshalb aus id(1).
      args:
        HOST_USER: ${AUTOTRIGGER_DEV_HOST_USER:-${USER}}
        HOST_UID: ${AUTOTRIGGER_DEV_HOST_UID:-1000}
        HOST_GID: ${AUTOTRIGGER_DEV_HOST_GID:-1000}
        HOST_HOME: ${HOME}
    image: ai-automation-backend-dev-container
    container_name: ${AUTOTRIGGER_DEV_CONTAINER_NAME:-autotrigger-dev-container}
    ports:
      - "${AUTOTRIGGER_DEV_CONTAINER_PORT:-9090}:9090"
    volumes:
      - dev-container-data:/app/data
      # Docker-Socket und KI-Anbieter kommen aus der Override-Datei des Starters
      # (scripts/lib/host-mounts.sh): AUTOTRIGGER_DEV_DOCKER_SOCKET (Default 1),
      # AUTOTRIGGER_DEV_AI_FROM_HOST (Default login), AUTOTRIGGER_DEV_AI_PROVIDERS (262948a4).
      # Projektverzeichnisse: ohne sie sieht ein Workflow die Projekte nicht, auf die er
      # laut Projektpfad zugreifen soll.
      - ${AUTOTRIGGER_DEV_PROJECT_ROOT:-${HOME}/Entwicklung}:${AUTOTRIGGER_DEV_PROJECT_ROOT:-${HOME}/Entwicklung}
    environment:
      - AUTOMATION_DB_PATH=/app/data/automation.db
      # Onboarding-Texte: veröffentlichter Port und Container, in dem der API-Key liegt
      - AUTOMATION_INSTANCE_URL=http://localhost:${AUTOTRIGGER_DEV_CONTAINER_PORT:-9090}
      - AUTOMATION_INSTANCE_CONTAINER=${AUTOTRIGGER_DEV_CONTAINER_NAME:-autotrigger-dev-container}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AUTOMATION_SECURITY_ENABLED=true
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      # Dev laeuft mit allen Modulen — wie die Host-Instanz (config/application.yml: preset full).
      - AUTOMATION_MODULES_PRESET=${AUTOTRIGGER_DEV_PRESET:-full}
      - HOME=${HOME}
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dev-container-data:
