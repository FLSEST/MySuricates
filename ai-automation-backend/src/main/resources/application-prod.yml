spring:
  datasource:
    url: jdbc:sqlite:${AUTOMATION_DB_PATH:/var/lib/automation/automation.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true

  jpa:
    show-sql: false

automation:
  request-metrics:
    # The header reveals internal timings and the SQL count — off in the externally
    # facing environments. Startup-only so that a leaked API key cannot turn it on.
    server-timing-enabled: false
