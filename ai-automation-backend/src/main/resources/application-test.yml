spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true

server:
  port: 8090

automation:
  modules:
    preset: ${AUTOMATION_MODULES_PRESET:full}   # Test-Instanz prüft alle Features; öffentlicher Default ist core
  cors:
    allowed-origins: http://localhost:8090
  tray:
    enabled: false
  staging:
    auto-start: false
  backup:
    directory: /host-backups/test
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Test
