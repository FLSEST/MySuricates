spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000

server:
  port: 8090

automation:
  cors:
    allowed-origins: http://localhost:8090
  tray:
    enabled: false
  staging:
    auto-start: false
  backup:
    directory: /host-backups/test
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Test
