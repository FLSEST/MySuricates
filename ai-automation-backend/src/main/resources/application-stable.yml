spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true

server:
  port: 9091

automation:
  modules:
    preset: ${AUTOMATION_MODULES_PRESET:full}   # Stable mirrors full dev usage; public default is core
  cors:
    # Stable serves the UI itself (same-origin, CORS does not apply). Its own Tailscale
    # address is added automatically with remote-access, provided `tailscale` answers in the container (a8056256).
    allowed-origins: http://localhost:9091,https://localhost:9091
  staging:
    auto-start: false
  tray:
    enabled: false
  backup:
    directory: /host-backups/stable
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Produktiv
  request-metrics:
    # The header reveals internal timings and the SQL count — off in the externally
    # facing environments. Startup-only so that a leaked API key cannot turn it on.
    server-timing-enabled: false
