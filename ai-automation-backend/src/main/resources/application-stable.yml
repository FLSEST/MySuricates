spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000

server:
  port: 9091

automation:
  cors:
    allowed-origins: http://localhost:9091
  staging:
    auto-start: false
  tray:
    enabled: false
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Produktiv
