spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true

server:
  port: 9091

automation:
  cors:
    allowed-origins: http://localhost:9091,https://localhost:9091,http://100.*:9091,https://100.*:9091,https://*.tail*.ts.net:*
  staging:
    auto-start: false
  tray:
    enabled: false
  backup:
    directory: /host-backups/stable
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Produktiv
