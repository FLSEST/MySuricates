spring:
  datasource:
    url: jdbc:sqlite:/app/data/automation.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true

server:
  port: 9091

automation:
  modules:
    preset: ${AUTOMATION_MODULES_PRESET:full}   # Stable spiegelt die volle Dev-Nutzung; öffentlicher Default ist core
  cors:
    # Stable liefert die Oberfläche selbst aus (Same-Origin, CORS greift nicht). Die eigene Tailscale-
    # Adresse kommt mit remote-access automatisch dazu, sofern `tailscale` im Container antwortet (a8056256).
    allowed-origins: http://localhost:9091,https://localhost:9091
  staging:
    auto-start: false
  tray:
    enabled: false
  backup:
    directory: /host-backups/stable
  serve-frontend: true
  frontend-path: /app/frontend
  environment: Produktiv
  request-metrics:
    # Der Header verraet interne Zeiten und die SQL-Zahl — in den nach aussen zeigenden
    # Umgebungen aus. Startup-only, damit ein geleakter API-Key ihn nicht einschalten kann.
    server-timing-enabled: false
