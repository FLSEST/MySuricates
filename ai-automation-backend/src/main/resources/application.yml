spring:
  application:
    name: ai-automation-backend

  datasource:
    url: jdbc:sqlite:${AUTOMATION_DB_PATH:./data/automation.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1  # SQLite supports only one writer at a time — pool=1 serializes via Hikari queue instead of SQLite locks (avoids SQLITE_BUSY under concurrent workflow runs)
      minimum-idle: 1
      connection-timeout: 120000  # 120s (default: 30s) — safety net for pool-size=1 contention during concurrent workflow runs
      leak-detection-threshold: 60000  # 60s — logs a WARNING + stack trace when a connection is held this long. (Was temporarily 2s while diagnosing the residual pool exhaustion fa741274; root cause — getDashboard fetching step TEXT blobs — fixed in 65fd5eee, so the 2s diagnostic magnifier is no longer needed.)
      connection-test-query: SELECT 1
      # ONE statement only: sqlite-jdbc executes just the first statement of a multi-statement string
      # (verified 2026-09-11 — foreign_keys/busy_timeout therefore live in the JDBC URL above).
      # auto_vacuum has no URL form; it only takes effect on an empty DB or after a full VACUUM on
      # a connection that has it set — DatabaseBackupService.checkAutoVacuumMode warns until then.
      connection-init-sql: "PRAGMA auto_vacuum = INCREMENTAL"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Logs every statement slower than this (ms) with its runtime. Hibernate reads the
        # threshold once at startup, so it is not runtime-switchable like the request metrics.
        # 0 would log every statement — keep it at a value that only catches real outliers.
        log_slow_query: 200

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Allow migrations that mix transactional and non-transactional statements (e.g. SQLite PRAGMA + DDL).
    mixed: true
    # Flyway 10+ uses two connections (migration + lock monitor). With HikariCP pool-size=1
    # this deadlocks. Giving Flyway its own non-pooled DataSource fixes the issue.
    url: jdbc:sqlite:${AUTOMATION_DB_PATH:./data/automation.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC

  threads:
    virtual:
      enabled: true

server:
  port: ${AUTOMATION_PORT:9090}
  ssl:
    enabled: ${AUTOMATION_SSL_ENABLED:false}
    key-store: ${AUTOMATION_SSL_KEYSTORE:./certs/dev.p12}
    key-store-password: ${AUTOMATION_SSL_PASSWORD:mysuricates}
    key-store-type: PKCS12
    key-alias: mysuricates

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  container:
    cpu-quota: 200000
    memory-limit: 4000000000
    pids-limit: 100
    idle-timeout-minutes: 60

app:
  version: @project.version@
  build-timestamp: @maven.build.timestamp@

automation:
  # Wie Agenten auf diesem Rechner die Instanz erreichen — landet in den Texten, die MySuricates in
  # Projekte schreibt (Onboarding-Profile). Der Installer setzt beides aus deploy/instances/<name>.env
  # (scripts/instance.sh, deploy/compose.yml). Leer: http://localhost:<server.port>, Key-Datei direkt.
  instance:
    url: ${AUTOMATION_INSTANCE_URL:}
    # Name des Containers, in dem das Backend läuft — die Key-Datei gibt es dann nur darin.
    container: ${AUTOMATION_INSTANCE_CONTAINER:}
  # Optionale Module — nur beim Start gelesen, bewusst nicht per REST umschaltbar.
  # preset: core (nur Kern) | research (+ chains, assistant, learning, memory, audit, bpmn) | full (alles)
  # Einzel-Override schlägt das Preset: automation.modules.<name>: true|false
  #   (Env: AUTOMATION_MODULES_<NAME>, z. B. AUTOMATION_MODULES_REMOTE_ACCESS=true)
  # Katalog und Abhängigkeiten: com.automation.modules.ModuleCatalog, Settings → "Module & Härtung"
  modules:
    preset: ${AUTOMATION_MODULES_PRESET:core}
    # true = feature modules can also be switched under Settings → Modules & hardening; applies
    # immediately (stored in app_settings, wins over the values here). Hardening stays startup-only.
    # WARNING: anyone with the API key can then turn on e.g. webhooks (public endpoint), integrations
    # (tokens), remote access or the run terminal (host access). Keep it off on publicly reachable
    # instances. Templates: config-examples/application-minimal.yml / application-maximal.yml
    ui-editable: ${AUTOMATION_MODULES_UI_EDITABLE:false}
  # Optionale Workflow-Härtung — unabhängig vom Preset, gleiche Regeln (nur Startkonfig).
  # provenance (Default true) · sealing · require-sealed-for-unattended · webhook-signatures
  # hardening:
  #   sealing: true
  discovery:
    auto-tagging-enabled: ${AUTOMATION_DISCOVERY_AUTO_TAGGING_ENABLED:true}
    semantic-enabled: ${AUTOMATION_DISCOVERY_SEMANTIC_ENABLED:true}
  integration:
    key-file: ${AUTOMATION_INTEGRATION_KEY_FILE:${user.home}/.autotrigger/integration-encryption.key}    # AES-Key für Integration-Credentials — nie in der DB neben dem Ciphertext
  autopilot:
    project-id: ${AUTOMATION_AUTOPILOT_PROJECT_ID:}    # Optional: UUID des Autopilot-Projekts für Health-Auto-Todos (leer = kein Project-Bezug)
  cli:
    host-home: ${AUTOMATION_HOST_HOME:}    # Default: System.getProperty("user.home")
    host-uid: ${AUTOMATION_HOST_UID:}      # Default: detected via 'id -u'
    skip-permissions: ${AUTOMATION_CLI_SKIP_PERMISSIONS:true}
    allowed-tools: ${AUTOMATION_CLI_ALLOWED_TOOLS:}
  cors:
    allowed-origins: ${AUTOMATION_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://localhost:3000,https://localhost:5173,http://100.*:3000,https://100.*:3000,https://*.tail*.ts.net:*}
  workspace:
    root: ${AUTOMATION_WORKSPACE_ROOT:}
  security:
    enabled: ${AUTOMATION_SECURITY_ENABLED:true}
    api-key: ${AUTOMATION_API_KEY:}
    trusted-proxies: ${AUTOMATION_TRUSTED_PROXIES:127.0.0.1,::1}
    rate-limit:
      enabled: ${AUTOMATION_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${AUTOMATION_RATE_LIMIT_RPM:120}
      # Backoff-Budget des Browser-Clients. Geht über GET /api/v1/system/info an ihn; ohne diese
      # Werte nimmt er seine eingebauten Konstanten (2 s / 10 s) — auf einer Instanz mit anderem
      # Limit wären die geraten (37b98c97).
      client-global-backoff-seconds: ${AUTOMATION_RATE_LIMIT_CLIENT_GLOBAL_BACKOFF_SECONDS:2}
      client-default-retry-after-seconds: ${AUTOMATION_RATE_LIMIT_CLIENT_DEFAULT_RETRY_AFTER_SECONDS:10}
  websocket:
    # Lifetime of a single-use WebSocket handshake ticket (POST /api/v1/ws-ticket). Long enough for
    # the browser to open the socket, short enough that a leaked URL is worthless.
    ticket-ttl-seconds: ${AUTOMATION_WS_TICKET_TTL_SECONDS:30}
  activity-log:
    max-request-bytes: ${AUTOMATION_ACTIVITY_LOG_MAX_BYTES:65536}
  ai:
    default-provider: ${AUTOMATION_AI_DEFAULT_PROVIDER:CLAUDE}
  host-claude:
    timeout-seconds: ${AUTOMATION_HOST_CLAUDE_TIMEOUT:300}
    inter-call-delay-ms: ${AUTOMATION_HOST_CLAUDE_INTER_CALL_DELAY_MS:0}
    max-concurrent-calls: ${AUTOMATION_HOST_CLAUDE_MAX_CONCURRENT_CALLS:5}
    reserved-for-interactive: ${AUTOMATION_HOST_CLAUDE_RESERVED_INTERACTIVE:1}
  host-pi:
    timeout-seconds: ${AUTOMATION_HOST_PI_TIMEOUT:300}
    inter-call-delay-ms: ${AUTOMATION_HOST_PI_INTER_CALL_DELAY_MS:0}
    max-concurrent-calls: ${AUTOMATION_HOST_PI_MAX_CONCURRENT_CALLS:5}
    reserved-for-interactive: ${AUTOMATION_HOST_PI_RESERVED_INTERACTIVE:1}
    default-backend-provider: ${AUTOMATION_HOST_PI_BACKEND:anthropic}
    default-thinking-level: ${AUTOMATION_HOST_PI_THINKING:medium}
  model-catalog:
    ttl-seconds: ${AUTOMATION_MODEL_CATALOG_TTL:600}              # Cache für host-entdeckte Modell-Listen (pi/codex); Laufzeit-Setting model-catalog-ttl-seconds
    probe-timeout-seconds: ${AUTOMATION_MODEL_CATALOG_PROBE_TIMEOUT:15}
  task-command:
    timeout-seconds: ${AUTOMATION_TASK_COMMAND_TIMEOUT:60}    # Timeout für einen `task`-CLI-Aufruf (Taskwarrior-Integration)
  todo-trigger:
    poll-interval-ms: ${AUTOMATION_TODO_TRIGGER_POLL_MS:300000}
    # Pausiert den TodoTrigger-Mechanismus (Backlog-Poll UND Event-Pfad) bis zu diesem
    # ISO-Instant — das Gegenstueck zu automation.scheduler.skip-until, mit dem zusammen
    # eine komplette Trigger-Pause aus zwei Zeilen besteht. Bewusst ein Datum statt eines
    # Flags: es laeuft von selbst aus, waehrend ein vergessenes enabled=false den
    # Self-Improvement-Loop stumm stillstehen laesst. Leer = keine Pause.
    skip-until: ${AUTOMATION_TODO_TRIGGER_SKIP_UNTIL:}
  scheduler:
    skip-until: ${AUTOMATION_SCHEDULER_SKIP_UNTIL:}
    # Gap between two scheduler ticks (minutes) interpreted as a system resume after suspend/freeze.
    # On such a tick — and on the first tick after a cold start — occurrences the backend missed are
    # handled by the catch-up policy (skip forward, or queue for sequential catch-up when opted in)
    # instead of firing all at once. 0 disables both detections (legacy: fire everything due).
    resume-grace-minutes: ${AUTOMATION_SCHEDULER_RESUME_GRACE:5}
  chain:
    workflow-timeout-minutes: ${AUTOMATION_CHAIN_WORKFLOW_TIMEOUT:180}
  execution:
    max-concurrent: ${AUTOMATION_MAX_CONCURRENT_RUNS:10}
    allow-docker-socket-mount: ${AUTOMATION_ALLOW_DOCKER_SOCKET_MOUNT:false}
    allow-extra-mounts: ${AUTOMATION_ALLOW_EXTRA_MOUNTS:false}
    # Comma-separated list of host-path prefixes that container bind-mounts are restricted to.
    # When empty (default), only allow-extra-mounts + FORBIDDEN_MOUNT_PATHS apply (legacy behavior).
    # When set, the host side of every extra mount must start with one of these prefixes.
    # Supports leading "~" (= $HOME). Example: "~/Entwicklung,~/dokumente"
    allowed-mount-prefixes: ${AUTOMATION_ALLOWED_MOUNT_PREFIXES:}
    # Comma-separated allowlist of Docker images a shell block may request via `container_image`.
    # When empty (default), any image is allowed (logged once as a WARNING at startup). An entry
    # matches by exact equality, as a registry/namespace prefix when it ends with "/", or, when it
    # has no tag, against the image's bare name or any of its tags.
    # Example: "automation-agent-devops:latest,automation-agent-python,ghcr.io/myorg/"
    allowed-container-images: ${AUTOMATION_ALLOWED_CONTAINER_IMAGES:}
    # Ghost-Run-Watchdog: maximal tolerierte Zeit zwischen save(RUNNING) und register().
    # Muss laenger sein als der laengste legitime Semaphore-Wait + Container-Init.
    ghost-watchdog-stale-minutes: ${AUTOMATION_GHOST_WATCHDOG_STALE:30}
  executions:
    # false = DELETE /api/v1/executions/{id} answers 403 RUN_DELETION_DISABLED and the UI hides the
    # delete buttons. Startup-only (no REST/settings switch). Retention/cleanup jobs are not affected
    # (set automation.run.retention.retention-days to 0 to keep every finished run).
    allow-delete: ${AUTOMATION_EXECUTIONS_ALLOW_DELETE:true}
  # Live-Output laufender Blöcke (Shell-Zeilen, KI-Tool-Aufrufe) im Run-Log; nur im Speicher (LiveLogConfig)
  live-log:
    enabled: ${AUTOMATION_LIVE_LOG_ENABLED:true}
    max-line-length: 2000
    buffer-lines: 1000
    flush-interval-ms: 250
    max-lines-per-flush: 200
    max-chars-per-flush: 32000
    retention-minutes: 10
    max-buffered-runs: 20
  summarization:
    base-dir: ${AUTOMATION_SUMMARIZATION_DIR:${user.home}/.autotrigger/summarization}
    timeout-seconds: ${AUTOMATION_SUMMARIZATION_TIMEOUT:120}
  backup:
    enabled: ${AUTOMATION_BACKUP_ENABLED:true}
    cron: ${AUTOMATION_BACKUP_CRON:0 0 2 * * *}
    retain-count: ${AUTOMATION_BACKUP_RETAIN_COUNT:30}
    directory: ${AUTOMATION_BACKUP_DIR:${user.home}/.autotrigger/backups/dev}
  staging:
    compose-file: ${AUTOMATION_STAGING_COMPOSE:docker-compose.stable.yml}
    backend-dir: ${AUTOMATION_STAGING_BACKEND_DIR:}
    frontend-dir: ${AUTOMATION_STAGING_FRONTEND_DIR:}
    container-name: ${AUTOMATION_STAGING_CONTAINER:mysuricates-stable}
    stable-frontend-dir: ${AUTOMATION_STAGING_FRONTEND:stable-frontend}
    health-url: ${AUTOMATION_STAGING_HEALTH_URL:http://localhost:9091/api/v1/system/health}
    test-compose-file: ${AUTOMATION_TEST_COMPOSE:docker-compose.test.yml}
    test-container-name: ${AUTOMATION_TEST_CONTAINER:mysuricates-test}
    test-health-url: ${AUTOMATION_TEST_HEALTH_URL:http://localhost:8090/api/v1/system/health}
    # Stable/Test werden nicht mehr automatisch mit dem Dev-Backend hochgefahren,
    # sondern bewusst per Desktop-Icon bzw. ./scripts/staging.sh gestartet.
    # Zum Reaktivieren: AUTOMATION_STAGING_AUTO_START / AUTOMATION_TEST_AUTO_START=true.
    auto-start: ${AUTOMATION_STAGING_AUTO_START:false}
    test-auto-start: ${AUTOMATION_TEST_AUTO_START:false}
  factory:
    provider: ${AUTOMATION_FACTORY_PROVIDER:CLAUDE}
    base-dir: ${AUTOMATION_FACTORY_DIR:${user.home}/.autotrigger/factory}
  docs:
    directory: ${AUTOMATION_DOCS_DIR:../docs}
  reports:
    directory: ${AUTOMATION_REPORTS_DIR:../reports}
  pool:
    directory: ${AUTOMATION_POOL_DIR:workflow-pool}
    enabled: ${AUTOMATION_POOL_ENABLED:true}
  examples:
    # Copy of the bundled example project (POST /projects/example). Empty: below the workspace root
    # if one is set, else ./data/examples next to the default database (ExampleProjectService).
    directory: ${AUTOMATION_EXAMPLES_DIR:}
  wish:
    total-timeout-minutes: ${AUTOMATION_WISH_TOTAL_TIMEOUT:120}
    workflow-wait-minutes: ${AUTOMATION_WISH_WORKFLOW_WAIT:30}
    watchdog-enabled: ${AUTOMATION_WISH_WATCHDOG_ENABLED:true}
    watchdog-interval-ms: ${AUTOMATION_WISH_WATCHDOG_INTERVAL:120000}
    watchdog-stale-minutes: ${AUTOMATION_WISH_WATCHDOG_STALE:45}
    default-shell-timeout-seconds: ${AUTOMATION_WISH_SHELL_TIMEOUT:600}
    default-agentic-timeout-seconds: ${AUTOMATION_WISH_AGENTIC_TIMEOUT:900}
    default-agentic-iteration-timeout-seconds: ${AUTOMATION_WISH_AGENTIC_ITER_TIMEOUT:900}
    default-agentic-total-timeout-seconds: ${AUTOMATION_WISH_AGENTIC_TOTAL_TIMEOUT:3600}
  tray:
    enabled: ${AUTOMATION_TRAY_ENABLED:true}
    poll-interval-ms: ${AUTOMATION_TRAY_POLL_MS:15000}
    web-ui-url: ${AUTOMATION_WEB_UI_URL:http://localhost:3000}
    stable-url: ${AUTOMATION_STABLE_URL:http://localhost:9091}
    public-url: ${AUTOMATION_TRAY_PUBLIC_URL:}
