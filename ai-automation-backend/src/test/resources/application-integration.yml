spring:
  datasource:
    url: jdbc:sqlite:/tmp/autotrigger-integrationtest.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite supports only one writer — integration tests MUST mirror prod (pool-size=1).
      # pool>1 + WAL on the shared file DB caused intermittent SQLITE_CORRUPT at context startup,
      # and pool>1 also MASKS pool-size=1 deadlocks (tests pass while prod would starve).
      # See CLAUDE.md → "HikariCP pool-size = 1". Do NOT raise without switching off SQLite.
      maximum-pool-size: 1
      minimum-idle: 1
      connection-test-query: SELECT 1
      connection-init-sql: "PRAGMA foreign_keys = ON; PRAGMA busy_timeout = 30000;"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    # Use the same file-based URL as the datasource. File DBs persist across
    # DataSource lifetimes (unlike in-memory), so Flyway can use its own
    # non-pooled DataSource without the DB vanishing before HikariCP connects.
    url: jdbc:sqlite:/tmp/autotrigger-integrationtest.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC

automation:
  security:
    enabled: false
  tray:
    enabled: false
  staging:
    auto-start: false
    test-auto-start: false
  host-claude:
    timeout-seconds: 10
    max-concurrent-calls: 1

server:
  port: 0
