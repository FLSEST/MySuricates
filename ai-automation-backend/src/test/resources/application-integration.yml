spring:
  datasource:
    # integration.db.path is set per test JVM by IntegrationTestDbSessionListener so that
    # CONCURRENT mvn test runs (e.g. two quality-gate workflows on the same schedule tick)
    # never share one SQLite file — two WAL writer processes corrupt it (SQLITE_BUSY_SNAPSHOT
    # → SQLITE_CORRUPT, seen 2026-07-09). The fallback path only applies when the listener
    # did not run (e.g. exotic runners); the pre-test clean in pom.xml keeps it fresh.
    url: jdbc:sqlite:${integration.db.path:/tmp/autotrigger-integrationtest.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite supports only one writer — integration tests MUST mirror prod (pool-size=1).
      # pool>1 + WAL on the shared file DB caused intermittent SQLITE_CORRUPT at context startup,
      # and pool>1 also MASKS pool-size=1 deadlocks (tests pass while prod would starve).
      # See CLAUDE.md → "HikariCP pool-size = 1". Do NOT raise without switching off SQLite.
      maximum-pool-size: 1
      minimum-idle: 1
      connection-test-query: SELECT 1
      connection-init-sql: "PRAGMA auto_vacuum = INCREMENTAL"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    # Use the same file-based URL as the datasource. File DBs persist across
    # DataSource lifetimes (unlike in-memory), so Flyway can use its own
    # non-pooled DataSource without the DB vanishing before HikariCP connects.
    url: jdbc:sqlite:${integration.db.path:/tmp/autotrigger-integrationtest.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC

automation:
  security:
    enabled: false
  tray:
    enabled: false
  staging:
    auto-start: false
    test-auto-start: false
  host-claude:
    timeout-seconds: 10
    max-concurrent-calls: 1
  backup:
    # Without this override every @SpringBootTest context wrote a startup backup of its
    # throwaway test DB into the developer's real ${user.home}/.autotrigger/backups/dev and
    # rotated genuine backups away (retain-count 30). integration.backup.dir is set per test
    # JVM by IntegrationTestDbSessionListener (deleted on session close); the fallback path
    # only applies when the listener did not run (e.g. exotic runners).
    enabled: false
    directory: ${integration.backup.dir:${java.io.tmpdir}/autotrigger-integrationtest-backups}
  integration:
    # integration.key.path is set per test JVM by IntegrationTestDbSessionListener (same
    # mechanism as integration.db.path above) so that IntegrationEncryptionService.init()
    # never falls through to its production default (${user.home}/.autotrigger/...) and
    # generates/writes a key into the developer's real home directory (happened
    # 2026-08-06, shadowing the real key on every test run). The fallback path only
    # applies when the listener did not run (e.g. exotic runners).
    key-file: ${integration.key.path:${java.io.tmpdir}/autotrigger-integrationtest.key}

server:
  port: 0
