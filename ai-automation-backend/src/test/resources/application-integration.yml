spring:
  datasource:
    # integration.db.path is set per test JVM by IntegrationTestDbSessionListener so that
    # CONCURRENT mvn test runs (e.g. two quality-gate workflows on the same schedule tick)
    # never share one SQLite file — two WAL writer processes corrupt it (SQLITE_BUSY_SNAPSHOT
    # → SQLITE_CORRUPT, seen 2026-07-09). The fallback path only applies when the listener
    # did not run (e.g. exotic runners); the pre-test clean in pom.xml keeps it fresh.
    url: jdbc:sqlite:${integration.db.path:/tmp/mysuricates-integrationtest.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite supports only one writer — integration tests MUST mirror prod (pool-size=1).
      # pool>1 + WAL on the shared file DB caused intermittent SQLITE_CORRUPT at context startup,
      # and pool>1 also MASKS pool-size=1 deadlocks (tests pass while prod would starve).
      # See CLAUDE.md → "HikariCP pool-size = 1". Do NOT raise without switching off SQLite.
      maximum-pool-size: 1
      minimum-idle: 1
      connection-test-query: SELECT 1
      connection-init-sql: "PRAGMA auto_vacuum = INCREMENTAL"

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    # Use the same file-based URL as the datasource. File DBs persist across
    # DataSource lifetimes (unlike in-memory), so Flyway can use its own
    # non-pooled DataSource without the DB vanishing before HikariCP connects.
    url: jdbc:sqlite:${integration.db.path:/tmp/mysuricates-integrationtest.db}?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC

automation:
  modules:
    # Integration tests exercise every controller; single tests disable a module via @TestPropertySource.
    preset: full
    # Belt and braces next to the surefire spring.config.location pin (pom.xml): these are the keys
    # the untracked dev config ai-automation-backend/config/application.yml sets, and they are what
    # broke the module tests when it leaked into the test JVM (TODO 39e55535). Values = the defaults
    # a clean checkout has, so nothing changes for CI.
    ui-editable: false
  hardening:
    # ModuleCatalog defaults — provenance on, the rest off. Do not "harden" the test run here:
    # the point is that tests see the same configuration as a fresh checkout.
    provenance: true
    sealing: false
    require-sealed-for-unattended: false
    require-signed-seal: false
    seal-immutable: false
    unattended-sandbox: false
    webhook-signatures: false
    private-network-guard: true
    private-network-guard-http-api: false
    private-network-guard-own-services: false
  scheduler:
    # The dev config parks skip-until on a future instant to pause the triggers and turns
    # catch-up-on-resume off along with it; tests must not inherit either. Values = the defaults
    # from SchedulerConfig / TodoTriggerConfig.
    skip-until: ""
    catch-up-on-resume: true
  todo-trigger:
    skip-until: ""
  security:
    enabled: false
    # A test that enables security without a key generates one and wrote it into the developer's
    # real ${automation.data-home}/api-key — the key file the installer scripts and agents read
    # (TODO 88781724). Same per-JVM directory as the setup files below.
    api-key-file: ${integration.setup.dir:${java.io.tmpdir}/mysuricates-integrationtest-setup}/api-key
  tray:
    enabled: false
  staging:
    auto-start: false
    test-auto-start: false
  host-claude:
    timeout-seconds: 10
    max-concurrent-calls: 1
  discovery:
    # Every created or changed workflow (and every context start, as a backfill) made
    # WorkflowTaggingService start `claude -p` in user.home — with the developer's CLI login, i.e.
    # real tokens on every local mvn test (TODO efc18b68). Guarded by IntegrationProfileAiIsolationTest.
    auto-tagging-enabled: false
  backup:
    # Without this override every @SpringBootTest context wrote a startup backup of its
    # throwaway test DB into the developer's real ${automation.data-home}/backups/dev and
    # rotated genuine backups away (retain-count 30). integration.backup.dir is set per test
    # JVM by IntegrationTestDbSessionListener (deleted on session close); the fallback path
    # only applies when the listener did not run (e.g. exotic runners).
    enabled: false
    directory: ${integration.backup.dir:${java.io.tmpdir}/mysuricates-integrationtest-backups}
  integration:
    # integration.key.path is set per test JVM by IntegrationTestDbSessionListener (same
    # mechanism as integration.db.path above) so that IntegrationEncryptionService.init()
    # never falls through to its production default (${automation.data-home}/...) and
    # generates/writes a key into the developer's real home directory (happened
    # 2026-08-06, shadowing the real key on every test run). The fallback path only
    # applies when the listener did not run (e.g. exotic runners).
    key-file: ${integration.key.path:${java.io.tmpdir}/mysuricates-integrationtest.key}
  seal:
    # Same reason as integration.key.path above: without this the seal signing key would be written
    # to the developer's real home (${automation.data-home}/seal-signing.key) on every test run.
    key-file: ${integration.seal.key.path:${java.io.tmpdir}/mysuricates-integrationtest-seal.key}
  # SummarizationSetupService and FactorySetupService write CLAUDE.md/AGENTS.md into <base-dir>/<provider>
  # on every context start; the defaults ${automation.data-home}/summarization|factory made every local
  # test run rewrite them in the developer's real home (TODO 6507e230). integration.setup.dir is set per
  # test JVM by IntegrationTestDbSessionListener (deleted on session close); the fallback path only
  # applies when the listener did not run. Guarded by IntegrationProfileHomeIsolationTest.
  summarization:
    base-dir: ${integration.setup.dir:${java.io.tmpdir}/mysuricates-integrationtest-setup}/summarization
  factory:
    base-dir: ${integration.setup.dir:${java.io.tmpdir}/mysuricates-integrationtest-setup}/factory
  # Isolated run checkouts default to ~/.mysuricates/workspaces in the real home (TODO 88781724).
  run-workspace:
    root: ${integration.setup.dir:${java.io.tmpdir}/mysuricates-integrationtest-setup}/workspaces


server:
  port: 0
