services:
  stable:
    build:
      context: .
      dockerfile: docker/Dockerfile.stable
      args:
        HOST_USER: ${USER}
        HOST_UID: ${UID:-1000}
        HOST_GID: ${GID:-1000}
        HOST_HOME: ${HOME}
    container_name: mysuricates-stable
    ports:
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=stable
      # Onboarding-Texte: API-Key liegt nur im Container (Port innen = außen, Adresse stimmt ohne URL)
      - AUTOMATION_INSTANCE_CONTAINER=mysuricates-stable
      - HOME=${HOME}
      - LOG_DIR=/app/data/logs
      - PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.local/bin
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      # Schlüssel außerhalb der Container-Schicht (3fb2242c): Integrations- und Siegel-Schlüssel liegen
      # auf einem eigenen Volume, getrennt von den Daten. In der Container-Schicht wären sie nach jedem
      # `compose down` weg — und mit ihnen die verschlüsselten Integrations-Zugänge und die Siegel.
      - AUTOMATION_INTEGRATION_KEY_FILE=/app/secrets/integration-encryption.key
      - AUTOMATION_SEAL_KEY_FILE=/app/secrets/seal-signing.key
    volumes:
      - stable-data:/app/data
      - stable-secrets:/app/secrets
      - ./stable-frontend:/app/frontend:ro
      - ./docker/entrypoint.sh:/app/entrypoint.sh:ro
      # KI-Anbieter und Docker-Socket kommen aus der Override-Datei, die scripts/staging.sh (und das
      # Backend beim Start aus der Oberflaeche) ueber scripts/lib/host-mounts.sh schreibt. Schalter:
      # STABLE_AI_FROM_HOST, STABLE_AI_PROVIDERS, STABLE_DOCKER_SOCKET in
      # ~/.config/mysuricates/staging.env (262948a4). Ohne die Override-Datei startet der Container
      # ohne KI-Anbieter und ohne Socket.
      - ${HOME}/Entwicklung:${HOME}/Entwicklung
      - ${HOME}/dokumente:${HOME}/dokumente
      - ${HOME}/.autotrigger/backups/stable:/host-backups/stable
    # Kein Auto-Start beim Boot — die Stable-Instanz wird bewusst per Desktop-Icon
    # bzw. ./scripts/staging.sh start gestartet.
    restart: "no"

volumes:
  stable-data:
  stable-secrets:
