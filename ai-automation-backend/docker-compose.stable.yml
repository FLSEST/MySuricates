services:
  stable:
    build:
      context: .
      dockerfile: docker/Dockerfile.stable
      args:
        HOST_USER: ${USER}
        HOST_UID: ${UID:-1000}
        HOST_GID: ${GID:-1000}
        HOST_HOME: ${HOME}
    container_name: mysuricates-stable
    ports:
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=stable
      - HOME=${HOME}
      - LOG_DIR=/app/data/logs
      - PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.local/bin
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
    volumes:
      - stable-data:/app/data
      - ./stable-frontend:/app/frontend:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.claude.json:${HOME}/.claude.json:ro
      - ${HOME}/.local/share/claude:${HOME}/.local/share/claude:ro
      - ${HOME}/.local/bin:${HOME}/.local/bin:ro
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/Entwicklung:${HOME}/Entwicklung
    restart: unless-stopped

volumes:
  stable-data:
