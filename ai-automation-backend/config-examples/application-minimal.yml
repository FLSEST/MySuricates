# MySuricates — MINIMAL configuration: platform core only, every option off.
#
# Usage: copy to ai-automation-backend/config/application.yml (or merge the blocks into it) and
# restart the backend. That file is read in addition to the built-in application.yml and takes
# precedence. Environment-variable form: docs/deployment.md → "Configurations: minimal and maximal".
#
# Core (always on): workflows, runs, projects, TODOs with TodoTrigger, schedules, activity log/DLQ,
# gates, workflow pool, templates, docs, settings.
#
# Difference to the public default: the things the default leaves on are off here — the standard
# modules dashboard-report and goals, and provenance (definition hash on every run). The preset is the
# same one.

automation:
  modules:
    # core = standard modules only (research = + research modules, full = all)
    preset: core
    # Modules cannot be switched in the settings — only here, followed by a restart.
    ui-editable: false
    # Standard module (on by default). Off here, because "minimal" means nothing optional at all.
    dashboard-report: false
    # Standard module (on by default): goals, work packages, milestones, TODO planning. Off here too; the
    # goal data stays in the database and is back when the module is switched on again.
    goals: false
  hardening:
    # No definition hash or version id on runs (the trigger source is still recorded).
    provenance: false
    # No seal endpoints. Workflows sealed earlier stay protected.
    sealing: false
    # Unattended runs (schedules, webhooks, triggers) also start unsealed workflows.
    require-sealed-for-unattended: false
    # Webhook signing secrets cannot be set. Secrets set earlier stay in force.
    webhook-signatures: false
    # iCal/RSS feeds may also be fetched from localhost and private networks.
    private-network-guard: false
    # http-api may reach localhost and private networks (the default).
    private-network-guard-http-api: false
    # CalDAV, Gitea, GitLab, ntfy and webhook notifications may reach your own network (the default).
    private-network-guard-own-services: false
