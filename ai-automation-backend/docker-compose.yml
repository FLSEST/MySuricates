services:
  # Agent images - build only, not run via compose. Used by the deploy/ instance (backend creates
  # and manages agent containers via the Docker API) and by the source-based dev instance.
  # Build all: AGENT_APT_REFRESH=$(date +%Y-%m) docker compose --profile build-only build
  # (a new value rebuilds the third-party APT layers of agent-devops instead of reusing old keyrings,
  # and the unpinned pip packages of agent-python instead of keeping those of the first build)
  #
  # There is no `backend` service here: the only supported way to run MySuricates in a container is
  # deploy/ (instance.sh/setup.sh) — see docs/deployment.md.
  agent-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-node
    image: automation-agent-node:latest
    profiles:
      - build-only

  agent-python:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-python
      args:
        PIP_REFRESH: ${AGENT_APT_REFRESH:-}
    image: automation-agent-python:latest
    profiles:
      - build-only

  agent-devops:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-devops
      args:
        APT_REFRESH: ${AGENT_APT_REFRESH:-}
    image: automation-agent-devops:latest
    profiles:
      - build-only

  agent-java:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-java
    image: automation-agent-java:latest
    profiles:
      - build-only
