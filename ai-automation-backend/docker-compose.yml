services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "9090:9090"
    volumes:
      - ./data:/app/data
      # WARNING: Docker socket gives the app full host Docker control.
      # Enable API key auth (AUTOMATION_SECURITY_ENABLED=true) in production.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOMATION_DB_PATH=/app/data/automation.db
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AUTOMATION_SECURITY_ENABLED=true
      # Leer lassen -> das Backend erzeugt beim ersten Start einen Schluessel und gibt ihn
      # im Log aus (docker compose logs backend | grep -i 'API KEY'). Eigenen Wert setzen:
      # AUTOMATION_API_KEY=... exportieren oder in eine .env neben dieser Datei schreiben.
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      # Optionale Module: core (Default) | research | full; einzelne Module per AUTOMATION_MODULES_<NAME>=true
      - AUTOMATION_MODULES_PRESET=${AUTOMATION_MODULES_PRESET:-core}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - automation

  # Agent images - build only, not run via compose.
  # The backend creates/manages agent containers via Docker API.
  # Build all: AGENT_APT_REFRESH=$(date +%Y-%m) docker compose --profile build-only build
  # (a new value rebuilds the third-party APT layers of agent-devops instead of reusing old keyrings)
  agent-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-node
    image: automation-agent-node:latest
    profiles:
      - build-only

  agent-python:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-python
    image: automation-agent-python:latest
    profiles:
      - build-only

  agent-devops:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-devops
      args:
        APT_REFRESH: ${AGENT_APT_REFRESH:-}
    image: automation-agent-devops:latest
    profiles:
      - build-only

  agent-java:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-java
    image: automation-agent-java:latest
    profiles:
      - build-only

networks:
  automation:
    driver: bridge
