services:
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.stable
    image: ai-automation-backend-test
    container_name: mysuricates-test
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - HOME=${HOME}
      - PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.local/bin
    volumes:
      - test-data:/app/data
      - ./stable-frontend:/app/frontend:ro
      - ./src/main/resources/application-test.yml:/app/config/application-test.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.local/share/claude:${HOME}/.local/share/claude:ro
      - ${HOME}/.local/bin:${HOME}/.local/bin:ro
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/Entwicklung:${HOME}/Entwicklung
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  test-data:
