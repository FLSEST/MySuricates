services:
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.stable
      args:
        HOST_USER: ${USER}
        HOST_UID: ${UID:-1000}
        HOST_GID: ${GID:-1000}
        HOST_HOME: ${HOME}
        # Neuer Wert (etwa der Monat) = NodeSource- und Docker-Repo frisch statt aus dem Layer-Cache (8b7a39b9)
        APT_REFRESH: ${MYSURICATES_APT_REFRESH:-}
    image: ai-automation-backend-test
    container_name: mysuricates-test
    # Kein ports-Eintrag hier: Den Port veroeffentlicht die Override-Datei von scripts/staging.sh,
    # standardmaessig nur auf 127.0.0.1 (TEST_BIND in ~/.config/mysuricates/staging.env oeffnet ihn
    # bewusst, etwa 0.0.0.0 fuers lokale Netz). Ohne Override veroeffentlicht er keinen Port.
    environment:
      - SPRING_PROFILES_ACTIVE=test
      # Onboarding-Texte: API-Key liegt nur im Container (Port innen = außen, Adresse stimmt ohne URL)
      - AUTOMATION_INSTANCE_CONTAINER=mysuricates-test
      - HOME=${HOME}
      - LOG_DIR=/app/data/logs
      - PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.local/bin
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY:-}
      # Schlüssel außerhalb der Container-Schicht (3fb2242c): Integrations- und Siegel-Schlüssel liegen
      # auf einem eigenen Volume, getrennt von den Daten. In der Container-Schicht wären sie nach jedem
      # `compose down` weg — und mit ihnen die verschlüsselten Integrations-Zugänge und die Siegel.
      - AUTOMATION_INTEGRATION_KEY_FILE=/app/secrets/integration-encryption.key
      - AUTOMATION_SEAL_KEY_FILE=/app/secrets/seal-signing.key
      # Kein KI-Tagging im Hintergrund (5d008bba): Sonst startet jeder angelegte oder geaenderte
      # Workflow — auch die, die Cypress mit CYPRESS_TARGET=test hier anlegt — einen KI-Aufruf mit der
      # Anmeldung des Containers. Wie die Integrationstests und die E2E-Nebeninstanz.
      - AUTOMATION_DISCOVERY_AUTO_TAGGING_ENABLED=false
    volumes:
      - test-data:/app/data
      - test-secrets:/app/secrets
      - ./stable-frontend:/app/frontend:ro
      - ./src/main/resources/application-test.yml:/app/config/application-test.yml:ro
      - ./docker/entrypoint.sh:/app/entrypoint.sh:ro
      # KI-Anbieter, Docker-Socket und Port kommen aus der Override-Datei, die scripts/staging.sh (und
      # das Backend beim Start aus der Oberflaeche) schreibt. Schalter: TEST_AI_FROM_HOST,
      # TEST_AI_PROVIDERS, TEST_DOCKER_SOCKET (Standard 0), TEST_BIND (Standard 127.0.0.1) in
      # ~/.config/mysuricates/staging.env (262948a4). Ohne die Override-Datei startet der Container
      # ohne KI-Anbieter, ohne Socket und ohne veroeffentlichten Port.
      - ${HOME}/Entwicklung:${HOME}/Entwicklung
      - ${AUTOMATION_DATA_HOME:-${HOME}/.mysuricates}/backups/test:/host-backups/test
    healthcheck:
      # --noproxy: Docker reicht Proxy-Variablen in den Container, curl schickt auch localhost
      # ueber sie — der Container wurde nie gesund (cf662c01)
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://localhost:8090/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Kein Auto-Start beim Boot — die Test-Instanz wird bewusst per Desktop-Icon
    # bzw. ./scripts/staging.sh test-start gestartet.
    restart: "no"

volumes:
  test-data:
  test-secrets:
