<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header with title and dark mode toggle -->
    <header class="header">
      <h1>Todo App</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
    </header>

    <!-- Input form for adding new todos -->
    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required
      />
      <button type="submit" class="btn btn-add">Add</button>
    </form>

    <!-- Filter buttons -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="open">Open</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Todo list container -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- Footer with item count and clear button -->
    <footer id="todo-footer" class="todo-footer">
      <span id="todo-count" class="todo-count">0 items</span>
      <button id="clear-completed" class="btn btn-clear">Clear completed</button>
    </footer>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
